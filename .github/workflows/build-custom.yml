name: Build moviepilot-neo Frontend

on:
  # neo 每次推送都重新构建并替换 dist.zip 资产（镜像内嵌前端，回滚靠镜像 digest）
  push:
    branches:
      - neo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release version
        run: |
          frontend_version=$(jq -r '.version' package.json)
          echo "frontend_version=v$frontend_version" >> $GITHUB_ENV

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Download Icons
        run: |
          curl -sL "https://github.com/jxxghp/MoviePilot-Plugins/archive/refs/heads/main.zip" | busybox unzip -d /tmp -
          mv /tmp/MoviePilot-Plugins-main/icons public/plugin_icon
          rm -rf /tmp/MoviePilot-Plugins-main

      - name: Build frontend
        run: |
          yarn --frozen-lockfile
          yarn build
          echo "$frontend_version+$GITHUB_SHA" > dist/version.txt
          zip -r dist.zip dist
          cp dist.zip "dist-${GITHUB_SHA}.zip"

      # dist-<commit>.zip 是镜像构建使用的不可变资产；dist.zip 仅保留给人工下载与兼容旧流程。
      # 不删除版本 Release，避免后端构建在删除与重建之间下载到旧资产或 404 页面。
      - name: Publish immutable frontend assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$frontend_version" >/dev/null 2>&1; then
            gh release create "$frontend_version" \
              --target "$GITHUB_SHA" \
              --title "$frontend_version" \
              --latest
          fi
          gh release upload "$frontend_version" \
            dist.zip \
            "dist-${GITHUB_SHA}.zip" \
            --clobber
