name: Build moviepilot-neo Frontend

on:
  # custom 每次推送都重新构建并替换 dist.zip 资产（镜像内嵌前端，回滚靠镜像 digest）
  push:
    branches:
      - custom
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release version
        run: |
          frontend_version=$(jq -r '.version' package.json)
          echo "frontend_version=v$frontend_version" >> $GITHUB_ENV

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Download Icons
        run: |
          curl -sL "https://github.com/jxxghp/MoviePilot-Plugins/archive/refs/heads/main.zip" | busybox unzip -d /tmp -
          mv /tmp/MoviePilot-Plugins-main/icons public/plugin_icon
          rm -rf /tmp/MoviePilot-Plugins-main

      - name: Build frontend
        run: |
          yarn
          yarn build
          echo "$frontend_version" > dist/version.txt
          zip -r dist.zip dist

      # 与官方一致：重建版本 tag 并发布 dist.zip；tag 指向 custom 构建提交
      - name: Delete Release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        continue-on-error: true
        with:
          tag_name: ${{ env.frontend_version }}
          delete_release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.frontend_version }}
          name: ${{ env.frontend_version }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
