worker_processes auto;

events {
    worker_connections 1024;
}


http {

    sendfile on;

    keepalive_timeout 3600;
    client_max_body_size 50m;

    proxy_cache_path /tmp levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m use_temp_path=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_vary on;
    gzip_comp_level 6;

    server {

        include mime.types;
        default_type application/octet-stream;

        listen 3000;
        listen [::]:3000;
        server_name moviepilot;

        location / {
            # 主目录
            expires off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            root html;
            try_files $uri $uri/ /index.html;
        }

        location = /service-worker.js {
            # Service Worker 必须保持稳定 URL 并每次重新验证，避免前端更新后继续注册旧版本。
            expires off;
            add_header Cache-Control "no-cache, must-revalidate";
            root html;
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            # Web App Manifest 参与 PWA 安装与资源发现，不能跟普通静态资源一起长缓存。
            expires off;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache, must-revalidate";
            root html;
            try_files $uri =404;
        }

        location ^~ /assets {
            # 静态资源
            add_header Cache-Control "public, max-age=31536000, immutable";
            root html;
        }

        location ^~ /api/v1/site/icon/ {
            # 站点图标缓存，优先于静态后缀正则命中后端接口
            proxy_cache my_cache;
            proxy_cache_valid 200 302 1h;
            proxy_cache_valid any 5m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_pass http://backend_api;
        }

        location ^~ /api {
            # SSE 流式接口嵌套匹配，避免外层 ^~ 跳过流式超时与禁缓冲配置
            location ~ ^/api/v1/(system/(message|progress/|logging)|search/.*/stream$|message/agent/stream$) {
                default_type text/event-stream;

                add_header Cache-Control "no-cache, no-transform";
                add_header X-Accel-Buffering no;
                gzip off;
                proxy_buffering off;
                proxy_cache off;

                proxy_pass http://backend_api;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_read_timeout 3600s;
            }

            # 后端API（使用 ^~ 防止静态后缀正则拦截联邦插件 /api/v1/plugin/file/... 的 .js/.png 请求）
            proxy_pass http://backend_api;
            rewrite ^.+mock-server/?(.*)$ /$1 break;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Nginx-Proxy true;

            # 超时设置
            proxy_read_timeout 600s;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            # 静态资源
            expires 1y;
            add_header Cache-Control "public, immutable";
            root html;
        }

        location /cookiecloud {
            # 后端cookiecloud地址
            proxy_pass http://backend_api;
            rewrite ^.+mock-server/?(.*)$ /$1 break;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-Nginx-Proxy true;

            # 超时设置
            proxy_read_timeout 600s;
        }

    }

    upstream backend_api {
        # 后端API的地址和端口
        server 127.0.0.1:3001;
        # 可以添加更多后端服务器作为负载均衡
    }

}
